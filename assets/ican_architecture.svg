<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">iCan Eye system architecture</title>
  <desc id="desc">An ESP32 camera sends JPEG images over Bluetooth to a Flutter iOS application. The application selects cloud or local vision, then produces spoken output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0d1b2d"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#203249" stroke-width="0.7" opacity="0.55"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000814" flood-opacity="0.48"/>
    </filter>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4ade80"/>
    </marker>
    <style>
      .heading { font-family: Inter, Arial, sans-serif; font-size: 34px; font-weight: 750; fill: #f8fafc; }
      .subheading { font-family: Inter, Arial, sans-serif; font-size: 15px; fill: #94a3b8; }
      .nodeTitle { font-family: Inter, Arial, sans-serif; font-size: 19px; font-weight: 700; fill: #f8fafc; }
      .nodeText { font-family: Inter, Arial, sans-serif; font-size: 14px; fill: #cbd5e1; }
      .label { font-family: Inter, Arial, sans-serif; font-size: 13px; font-weight: 650; fill: #7dd3fc; }
      .small { font-family: Inter, Arial, sans-serif; font-size: 12px; fill: #94a3b8; }
    </style>
  </defs>

  <rect width="1200" height="720" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="720" rx="24" fill="url(#grid)"/>

  <text x="64" y="66" class="heading">iCan Eye</text>
  <text x="64" y="96" class="subheading">Camera to speech architecture for accessible scene understanding</text>

  <path d="M 288 300 C 330 300 340 300 382 300" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrowCyan)"/>
  <path d="M 710 274 C 770 230 792 206 842 206" fill="none" stroke="#38bdf8" stroke-width="3" marker-start="url(#arrowGreen)" marker-end="url(#arrowCyan)"/>
  <path d="M 710 326 C 770 370 792 394 842 394" fill="none" stroke="#38bdf8" stroke-width="3" marker-start="url(#arrowGreen)" marker-end="url(#arrowCyan)"/>
  <path d="M 546 430 C 546 484 546 500 546 548" fill="none" stroke="#4ade80" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <path d="M 382 352 C 332 400 314 438 286 492" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrowCyan)"/>

  <text x="305" y="282" class="label">Bluetooth image stream</text>
  <text x="724" y="166" class="label">Cloud path</text>
  <text x="724" y="186" class="small">Request and result</text>
  <text x="724" y="448" class="label">Local path</text>
  <text x="724" y="468" class="small">Request and result</text>
  <text x="482" y="520" class="label">Spoken result</text>

  <g filter="url(#shadow)">
    <rect x="64" y="210" width="224" height="180" rx="18" fill="#102c3f" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="112" cy="258" r="22" fill="#0c4a6e" stroke="#7dd3fc" stroke-width="2"/>
    <path d="M 101 258 L 108 265 L 123 249" fill="none" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="98" y="308" class="nodeTitle">iCan Eye</text>
    <text x="98" y="337" class="nodeText">XIAO ESP32 S3</text>
    <text x="98" y="360" class="nodeText">OV2640 camera and firmware</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="382" y="170" width="328" height="260" rx="20" fill="#0d2d27" stroke="#34d399" stroke-width="2"/>
    <rect x="410" y="202" width="72" height="72" rx="16" fill="#064e3b" stroke="#6ee7b7" stroke-width="2"/>
    <rect x="430" y="216" width="32" height="44" rx="7" fill="none" stroke="#d1fae5" stroke-width="2.5"/>
    <circle cx="446" cy="253" r="2.5" fill="#d1fae5"/>
    <text x="506" y="228" class="nodeTitle">iOS application</text>
    <text x="506" y="254" class="nodeText">BLE assembly and validation</text>
    <text x="410" y="316" class="nodeText">Vision backend selection</text>
    <text x="410" y="344" class="nodeText">Accessible controls and diagnostics</text>
    <text x="410" y="372" class="nodeText">Scene description and speech control</text>
    <rect x="410" y="392" width="202" height="20" rx="10" fill="#123f35"/>
    <text x="424" y="407" class="small">Flutter   Dart   Swift   Provider</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="842" y="142" width="294" height="128" rx="18" fill="#3a2b0b" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="884" cy="185" r="20" fill="#713f12" stroke="#fde68a" stroke-width="2"/>
    <path d="M 870 190 C 874 176 892 174 898 187 C 906 188 908 201 898 204 L 874 204 C 866 202 865 194 870 190" fill="none" stroke="#fef3c7" stroke-width="2"/>
    <text x="920" y="184" class="nodeTitle">Cloud vision</text>
    <text x="920" y="212" class="nodeText">Gemini scene description</text>
    <text x="920" y="236" class="small">Used when online and configured</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="842" y="330" width="294" height="128" rx="18" fill="#251344" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="884" cy="374" r="20" fill="#4c1d95" stroke="#c4b5fd" stroke-width="2"/>
    <path d="M 873 374 C 873 364 880 357 889 357 C 897 357 902 364 902 372 C 902 383 894 390 884 390 C 877 390 873 383 873 374" fill="none" stroke="#ede9fe" stroke-width="2"/>
    <text x="920" y="372" class="nodeTitle">Local vision</text>
    <text x="920" y="400" class="nodeText">Apple Vision and local models</text>
    <text x="920" y="424" class="small">Health checked before use</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="382" y="548" width="328" height="112" rx="18" fill="#14331f" stroke="#4ade80" stroke-width="2"/>
    <path d="M 422 603 L 434 603 L 449 615 L 449 579 L 434 591 L 422 591 z" fill="none" stroke="#bbf7d0" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 457 590 C 467 597 467 607 457 614" fill="none" stroke="#bbf7d0" stroke-width="2.5" stroke-linecap="round"/>
    <text x="492" y="594" class="nodeTitle">Accessible speech output</text>
    <text x="492" y="622" class="nodeText">iOS text to speech and VoiceOver</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="64" y="492" width="222" height="128" rx="18" fill="#172033" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="96" y="535" class="nodeTitle">Team cane interface</text>
    <text x="96" y="565" class="nodeText">Obstacle and telemetry data</text>
    <text x="96" y="590" class="small">Shared BLE protocol boundary</text>
  </g>

  <text x="64" y="688" class="small">The application reports unavailable backends instead of presenting unsupported capabilities as active.</text>
</svg>
